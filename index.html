<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>مشاوره با حال خوب</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600&display=swap">
<style>

@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1a25;--c:#162636;--t:#e5f1fa;--m:#8ea7bb;--p:#5ab6ee;--s:#1c3a52;--b:#26405a;color-scheme:dark}}

html,body{margin:0}body{background:var(--bg);color:var(--t);font:15px/1.8 Vazirmatn,Tahoma,sans-serif}
.w{max-width:960px;margin:auto;padding:12px}nav,.r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}nav{margin-bottom:12px}

button{background:var(--s);border:1px solid var(--b);border-radius:12px;padding:5px 14px;cursor:pointer}button.p,button.on{background:var(--p);color:#fff;border-color:var(--p)}

</style></head><body><div id="al" hidden data-a="dis"></div><div class="w" id="app"></div><script id="B" type="application/json">[]</script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),uid=()=>Math.random().toString(36).slice(2,9);
const ld=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fa=d=>d?new Intl.DateTimeFormat('fa-IR',{dateStyle:'medium'}).format(new Date(d+'T12:00')):'';
const WD=['یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه','شنبه'],K='cons1';
const mk=(n,g,goal,base,beh,sc)=>({id:uid(),demo:1,name:n,grade:g,phone:'',goal,tg:'',cd:'',base,beh,plan:'',res:'',mis:'',prob:'',pers:'',notes:[],ex:sc.map((s,i)=>({id:uid(),d:ld(new Date(Date.now()-6048e5*(sc.length-i))),t:'آزمون '+(i+1),s})),cards:[],log:[]});
let D;try{D=JSON.parse(localStorage.getItem(K))}catch(e){}
D=D||{st:[mk('سارا احمدی (نمونه)','دوازدهم تجربی','پزشکی','تراز متوسط در زیست و شیمی','منظم و پرسشگر',[48,55,61,67]),mk('علی رضایی (نمونه)','یازدهم تجربی','رتبه‌ی زیر ۵۰۰۰','ضعف در ریاضی','گاهی در ارسال گزارش دیر می‌کند',[40,38,52]),mk('نیلوفر کریمی (نمونه)','دوازدهم تجربی','داروسازی','پایه‌ی خوب در فیزیک','پرانرژی ولی کم‌حوصله',[70,66,72])],set:{ratio:2,cd:4,tr:'18:00',tn:'23:00',tw:'21:00'},ck:{}};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}};
let V={p:'home'};const S=()=>D.st.find(s=>s.id===V.id),cdv=s=>s.cd!==''&&s.cd!=null?+s.cd:+D.set.cd;
const nx=c=>{const d=new Date();while(d.getDay()!=c)d.setDate(d.getDate()+1);return ld(d)};
const cnt=(s,t)=>s.cards.filter(c=>c.a&&c.t==t).length,bd=s=>`🟡 ${cnt(s,'y')} &nbsp; 🔴 ${cnt(s,'r')}`;
const nav=()=>`<h2 style="color:var(--p);margin:0 0 8px">مشاوره با حال خوب 💙</h2><nav>${[['home','دانش‌آموزان'],['chk','چک‌لیست من'],['cal','تقویم آزمون‌ها'],['set','تنظیمات و پشتیبان']].map(([k,l])=>`<button class="${V.p==k||(k=='home'&&V.p=='file')?'on':''}" data-a="nav" data-v="${k}">${l}</button>`).join('')}</nav>`;
function home(){return`<h2>دانش‌آموزان من</h2><div class="r"><input id="q" placeholder="جست‌وجوی نام…" style="flex:1"><button class="p" data-a="add">+ دانش‌آموز جدید</button>${D.st.some(s=>s.demo)?'<button data-a="deldemo">حذف نمونه‌ها</button>':''}</div><br><div class="g">${D.st.map(s=>`<div class="c" data-a="open" data-id="${s.id}" data-n="${esc(s.name)}" style="cursor:pointer"><b>${esc(s.name)}</b><div class="m">${esc(s.grade)}</div><div>${bd(s)}</div></div>`).join('')||'<p class="m">هنوز دانش‌آموزی ثبت نشده است.</p>'}</div>`}
const ch=s=>{const a=s.ex.filter(e=>e.s!==''&&e.s!=null).sort((x,y)=>x.d<y.d?-1:1);if(a.length<2)return'';const p=a.map((e,i)=>[10+i*280/(a.length-1),110-e.s]);return`<svg viewBox="0 0 300 120" width="100%"><polyline fill="none" stroke="var(--p)" stroke-width="2" points="${p.map(q=>q.join(',')).join(' ')}"/>${p.map((q,i)=>`<circle cx="${q[0]}" cy="${q[1]}" r="3" fill="var(--p)"/><text x="${q[0]}" y="${q[1]-6}" font-size="9" text-anchor="middle" fill="var(--t)">${a[i].s}</text>`).join('')}</svg>`};
function file(){const s=S();if(!s.code){s.code=gen();save()}const T=(k,l,r=3)=>`<label class="m">${l}<textarea data-k="${k}" rows="${r}">${esc(s[k])}</textarea></label>`,I=(k,l)=>`<label class="m">${l}<input data-k="${k}" value="${esc(s[k])}"></label>`;
return`<div class="r"><button data-a="nav" data-v="home">بازگشت</button><button data-a="chkf">چک‌لیست این دانش‌آموز</button><button class="p" data-a="sf">ساخت فایل پرونده‌ی دانش‌آموز</button><button data-a="del">حذف دانش‌آموز</button></div><h2>${esc(s.name)} <small>${bd(s)}</small></h2>
<div class="c"><h3>مشخصات</h3><div class="g">${I('name','نام')}${I('grade','پایه و رشته')}${I('phone','تلفن')}${I('goal','هدف')}${I('tg','هدف زمانی')}<label class="m">روز تماس هفتگی (اختصاصی)<select data-k="cd"><option value="">پیش‌فرض</option>${WD.map((w,i)=>`<option value="${i}" ${s.cd!=='' && s.cd==i?'selected':''}>${w}</option>`).join('')}</select></label></div><p class="m">کد ورود دانش‌آموز: <b dir="ltr">${s.code}</b> (برای خود او بفرستید؛ پس از هر تغییر، از «تنظیمات» فایل سایت را دوباره بسازید و آپلود کنید.)</p>${T('pers','مشخصات تکمیلی')}</div>
<div class="c"><h3>وضعیت پایه و رفتار</h3>${T('base','وضعیت کلی و پایه‌ی دانش‌آموز')}${T('beh','نظر کلی رفتاری من')}</div>
<div class="c" style="border-color:var(--p)"><h3>تحلیل کلی مشاور 🔒</h3><p class="m">فقط برای شما؛ در فایل دانش‌آموز نمی‌آید.</p>${T('an','تحلیل کلی',6)}</div>
<div class="c"><h3>برنامه و منابع</h3>${T('plan','برنامه',5)}${T('res','منابع')}</div>

<div class="c"><h3>کارنامه، نمرات و آزمون‌ها</h3>${ch(s)}<div class="g"><input id="e1" placeholder="عنوان آزمون"><input id="e2" type="date" value="${ld()}"><input id="e3" type="number" placeholder="درصد (خالی = آزمون آینده)"></div><br><button class="p" data-a="aex">افزودن</button>${s.ex.slice().sort((a,b)=>a.d<b.d?1:-1).map(e=>`<div class="r"><span>${fa(e.d)}</span><b>${esc(e.t)}</b><span>${e.s===''||e.s==null?'(آینده)':e.s+'٪'}</span><button data-a="dex" data-id="${e.id}">حذف</button></div>`).join('')}</div>
<div class="c"><h3>کارت زرد و قرمز</h3><div class="g"><select id="c1"><option value="y">🟡 زرد</option><option value="r">🔴 قرمز</option></select><input id="c2" placeholder="دلیل"><input id="c3" placeholder="توضیح"></div><br><button class="p" data-a="acd">ثبت کارت</button><p class="m">هر ${D.set.ratio} کارت زرد فعال خودکار به یک قرمز تبدیل می‌شود؛ کارت قرمز با دکمه به زرد تنزل می‌یابد.</p>${s.cards.slice().reverse().map(c=>`<div class="r" style="opacity:${c.a?1:.5}"><span>${c.t=='y'?'🟡':'🔴'}</span><span>${fa(c.d)}</span><b>${esc(c.r)}</b><span class="m">${esc(c.n)}${c.a?'':' (تبدیل‌شده)'}</span>${c.a&&c.t=='r'?`<button data-a="dn" data-id="${c.id}">تنزل به زرد</button>`:''}</div>`).join('')}</div>
<div class="c"><h3>یادداشت جلسات</h3><textarea id="n1" rows="3"></textarea><br><button class="p" data-a="an">افزودن یادداشت</button>${s.notes.slice().reverse().map(n=>`<p><span class="m">${fa(n.d)}</span><br>${esc(n.t)}</p>`).join('')}</div>`}
function chk(){const L=V.f?D.st.filter(s=>s.id==V.f):D.st,td=ld(),cb=(k,l)=>`<label class="r"><input type="checkbox" style="width:auto" data-a="ck" data-k="${k}" ${D.ck[k]?'checked':''}> ${l}</label>`;
return`<h2>چک‌لیست کارهای من</h2><select data-a="fl"><option value="">همه‌ی دانش‌آموزان</option>${D.st.map(s=>`<option value="${s.id}" ${V.f==s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select><br><br>${L.map(s=>{const c=cdv(s),w=nx(c),k=x=>s.id+'|'+x;return`<div class="c"><b>${esc(s.name)}</b> <span class="m">${bd(s)}</span><h3>امروز</h3>${cb(k('a|'+td),'پاسخ به سؤال‌ها و مشکلات (روزانه)')}${cb(k('b|'+td),'بررسی گزارش کار (تا ۱۲ شب)')}<h3>تماس هفتگی (${WD[c]} ${fa(w)})</h3>${cb(k('w|'+w),'تنظیم زمان تماس (شب قبل)')}${[['c1','سلام و احوال‌پرسی'],['c2','تحلیل دقیق آزمون با جزئیات (درس‌های تجربی)'],['c3','پرسیدن سؤال درسی'],['c4','صحبت برای حال خوب']].map(([x,l])=>cb(k(x+'|'+w),l)).join('')}</div>`}).join('')}<div class="c">${cb('bk|'+nx(+D.set.cd),'پشتیبان‌گیری هفتگی از داده‌ها')}</div>`}
function cal(){const a=[];D.st.forEach(s=>s.ex.forEach(e=>{if((e.s===''||e.s==null)&&e.d>=ld())a.push([e.d,e.t,s.name])}));a.sort();return`<h2>آزمون‌های پیش‌رو</h2>${a.map(x=>`<div class="c"><b>${fa(x[0])}</b> ${esc(x[1])} <span class="m">${esc(x[2])}</span></div>`).join('')||'<p class="m">آزمون آینده‌ای ثبت نشده است.</p>'}`}
const gc=(t,h,r)=>`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(t)}&dates=20260101T${h}00/20260101T${h}00&recur=${encodeURIComponent(r)}`;
function sett(){const z=D.set,TM=(k,l)=>`<label class="m">${l}<input type="time" data-s="${k}" value="${z[k]}"></label>`;
return`<h2>تنظیمات</h2><div class="c"><div class="g"><label class="m">تعداد زرد برای یک قرمز<input type="number" min="2" data-s="ratio" value="${z.ratio}"></label><label class="m">روز تماس هفتگی<select data-s="cd">${WD.map((w,i)=>`<option value="${i}" ${z.cd==i?'selected':''}>${w}</option>`).join('')}</select></label>${TM('tr','آلارم پاسخ به سؤال‌ها')}${TM('tn','آلارم بررسی گزارش شبانه')}${TM('tw','آلارم شب قبل از تماس')}</div><br><div class="r"><button class="p" data-a="en">فعال‌سازی صدا و اعلان</button><button data-a="th">تغییر حالت روشن/تاریک</button></div><p class="m">آلارم‌ها فقط وقتی سایت باز است کار می‌کنند. برای زنگ مطمئن، این یادآورهای تکراری را به تقویم گوشی اضافه کنید:</p><div class="r"><a href="${gc('پاسخ به سؤال‌های دانش‌آموزان',z.tr.replace(':',''),'RRULE:FREQ=DAILY')}" target="_blank">روزانه</a><a href="${gc('بررسی گزارش کار دانش‌آموزان',z.tn.replace(':',''),'RRULE:FREQ=DAILY')}" target="_blank">شبانه</a><a href="${gc('تنظیم زمان تماس هفتگی',z.tw.replace(':',''),'RRULE:FREQ=WEEKLY')}" target="_blank">هفتگی</a></div></div>
<div class="c"><h3>پشتیبان‌گیری</h3><p class="m">داده‌ها فقط در همین مرورگر ذخیره می‌شوند؛ حتماً هفته‌ای یک بار فایل پشتیبان بگیرید.</p><div class="r"><button class="p" data-a="bx">ساخت فایل سایت با پرونده‌ی دانش‌آموزان</button><button class="p" data-a="exp">دریافت فایل پشتیبان</button><input type="file" id="imp" accept=".json" style="width:auto"></div></div><div class="c"><h3>نشانی دانش‌آموزان</h3><p class="m">به دانش‌آموزان، نشانی همین سایت را با <b>#student</b> در انتها بدهید تا فقط بخش مخصوص خودشان باز شود.</p></div>`}
const SP={hi:'سلام! خوش آمدی 🌤️',sub:'اینجا جای توست؛ هر سؤال، مشکل یا درخواستی داری همین‌جا بنویس.',tips:['برنامه‌ی روزانه‌ات را انجام بده و گزارش کارت را شب‌ها قبل از ساعت ۱۲ بفرست.','سؤال‌های درسی را همان روز بپرس تا جمع نشوند.','اشتباهات آزمون را یادداشت کن تا در تماس هفتگی با هم تحلیلشان کنیم.'],q:['قدم‌های کوچک هر روز، نتیجه‌ی بزرگ می‌سازند.','اشتباه یعنی داری یاد می‌گیری.','امروز یک قدم از دیروز جلوتری.'],contact:''};
const stu=()=>`<div class="c hero"><p class="m">مشاوره با حال خوب 💙</p><h2>${SP.hi}</h2><p>${SP.sub}</p><p class="m" id="qt">${SP.q[0]}</p><button data-a="qn">یک جمله‌ی انگیزشی دیگر 💙</button></div><div class="c"><h3>پرونده‌ی من</h3><div class="r"><input id="cd" dir="ltr" placeholder="کد ورود" style="flex:1"><button class="p" data-a="vf">نمایش پرونده</button></div><p class="m" id="vm"></p><iframe id="fr" sandbox style="width:100%;height:70vh;border:0;border-radius:12px;display:none"></iframe></div><div class="c"><h3>راهنما</h3><ol>${SP.tips.map(t=>`<li>${t}</li>`).join('')}</ol></div><div class="c"><h3>پیام یا درخواست برای مشاور</h3><input id="sn" placeholder="نام تو"><br><br><textarea id="sm" rows="5" placeholder="سؤال، مشکل یا درخواستت را بنویس…"></textarea><br><div class="r"><button class="p" data-a="cp">کپی پیام</button>${SP.contact?`<a href="${esc(SP.contact)}" target="_blank">ارسال برای مشاور</a>`:''}<span class="m" id="cm">پیام را کپی کن و برای مشاورت بفرست.</span></div></div>`;
function render(){const a=$('#app');if(location.hash=='#student'){a.innerHTML=stu();return}a.innerHTML=nav()+({home,file,chk,cal,set:sett}[V.p])();}
const tg=()=>{const r=document.documentElement;r.dataset.theme=(r.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))=='dark'?'light':'dark'};
async function dl(n,d){try{const x=await window.claude?.use('downloads');if(!x){const u=URL.createObjectURL(new Blob([d],{type:'text/plain'})),a=document.createElement('a');a.href=u;a.download=n;a.click();return}if(!x)return alert('ذخیره‌ی فایل در این محیط ممکن نیست.');await x.save({filename:n,data:d})}catch(e){}}
function addCard(s,t,r,n){s.cards.push({id:uid(),t,d:ld(),r:r||'بدون دلیل',n,a:1});const ys=s.cards.filter(c=>c.a&&c.t=='y');if(t=='y'&&ys.length>=+D.set.ratio){ys.slice(0,+D.set.ratio).forEach(c=>c.a=0);s.cards.push({id:uid(),t:'r',d:ld(),r:'تبدیل خودکار از کارت زرد',n:'',a:1})}}
const enc=new TextEncoder(),b64=b=>{let t='';new Uint8Array(b).forEach(c=>t+=String.fromCharCode(c));return btoa(t)},ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),gen=()=>Array.from(crypto.getRandomValues(new Uint8Array(12)),x=>'abcdefghjkmnpqrstuvwxyz23456789'[x%31]).join('').replace(/(.{4})/g,'$1-').slice(0,-1);
async function kd(c,salt){const k=await crypto.subtle.importKey('raw',enc.encode(c),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
