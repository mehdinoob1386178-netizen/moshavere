<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>مشاوره با حال خوب</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600&display=swap">
<style>
:root{--bg:#f3f9fe;--c:#fff;--t:#16324a;--m:#68829a;--p:#3d9fdc;--s:#dcf0fc;--b:#d9e7f2;--y:#e9b824;--r:#e0524d;color-scheme:light;box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1a25;--c:#162636;--t:#e5f1fa;--m:#8ea7bb;--p:#5ab6ee;--s:#1c3a52;--b:#26405a;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0e1a25;--c:#162636;--t:#e5f1fa;--m:#8ea7bb;--p:#5ab6ee;--s:#1c3a52;--b:#26405a;color-scheme:dark}
html,body{margin:0}body{background:var(--bg);color:var(--t);font:15px/1.8 Vazirmatn,Tahoma,sans-serif}
.w{max-width:960px;margin:auto;padding:12px}nav,.r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}nav{margin-bottom:12px}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--s);border:1px solid var(--b);border-radius:12px;padding:5px 14px;cursor:pointer}button.p,button.on{background:var(--p);color:#fff;border-color:var(--p)}
.c{background:var(--c);border:1px solid var(--b);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px #3d9fdc14}
input,textarea,select{width:100%;box-sizing:border-box;background:var(--bg);border:1px solid var(--b);border-radius:10px;padding:5px 10px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}h2,h3{margin:.2em 0}.m{color:var(--m);font-size:13px}
#al{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;background:var(--p);color:#fff;padding:12px;text-align:center;z-index:9;cursor:pointer}#al[hidden]{display:none}
.hero{background:linear-gradient(135deg,var(--s),var(--c));text-align:center;padding:26px 14px}
body{background-image:radial-gradient(circle at 12% 8%,#bfe6ff66,transparent 40%),radial-gradient(circle at 88% 85%,#ffd9ec66,transparent 40%);background-attachment:fixed}
@keyframes fl{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-14px) rotate(8deg)}}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.an .c{animation:pop .5s ease both}.c{transition:transform .2s,box-shadow .2s}.c:hover{transform:translateY(-2px);box-shadow:0 8px 22px #3d9fdc2e}
button{transition:transform .15s,box-shadow .15s}button:hover{transform:translateY(-2px) scale(1.04);box-shadow:0 4px 12px #3d9fdc40}
.deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}.deco i{position:absolute;font-style:normal;opacity:.17;animation:fl 6s ease-in-out infinite}.w{position:relative;z-index:1}
.av{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:30px;background:linear-gradient(135deg,var(--s),#ffe3f1);border:2px solid var(--p);flex:none}
.cardy,.cardr{display:inline-block;width:20px;height:28px;border-radius:4px;transform:rotate(-8deg);box-shadow:0 2px 5px #0003;vertical-align:middle;margin:0 3px}.cardy{background:linear-gradient(150deg,#ffe066,#e9b824)}.cardr{background:linear-gradient(150deg,#ff7b76,#d6403b)}
.ck{display:flex;gap:12px;align-items:center;font-size:19px;padding:12px 16px;border-radius:16px;background:var(--bg);margin:8px 0;cursor:pointer;transition:.3s}.ck input{width:26px;height:26px;accent-color:#2fb36b;flex:none}.ck.d{background:#2fb36b26;color:#2fb36b;text-decoration:line-through}
.bar{height:10px;border-radius:9px;background:var(--b);overflow:hidden}.bar b{display:block;height:100%;background:linear-gradient(90deg,#5ab6ee,#2fb36b);transition:width .5s}
body{font-weight:500}h2,h3{font-weight:700}h3{color:var(--p)}nav button{font-size:16px;padding:8px 18px;font-weight:600}.big{font-size:17px;padding:10px 20px;font-weight:600}
.c{border-width:2px;border-right:6px solid var(--p)}.c:nth-child(3n+2){border-right-color:#e0709e}.c:nth-child(3n+3){border-right-color:#25b58a}
body::before,body::after{content:"🧬 📚 🩺 🎓 ⚗️ 📐 🔬 ✏️ 🧪";position:fixed;top:0;writing-mode:vertical-rl;font-size:22px;letter-spacing:22px;opacity:.3;pointer-events:none;z-index:0}body::before{right:3px}body::after{left:3px}
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:14px}
.tl{display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px 10px;border-radius:22px;border:0;color:#fff;font-size:17px;background:linear-gradient(145deg,var(--k),color-mix(in srgb,var(--k),#fff 35%));box-shadow:0 6px 16px color-mix(in srgb,var(--k),transparent 60%)}.tl span{font-size:38px}.tl:hover{transform:translateY(-4px) scale(1.04)}
.ex{display:flex;gap:12px;align-items:center;padding:12px 14px;margin:8px 0;border-radius:18px;background:var(--c);border:1px solid var(--b);border-right:6px solid var(--p);cursor:pointer;transition:.2s}.ex:hover{transform:translateX(-4px);box-shadow:0 6px 16px #3d9fdc2e}.bd{background:var(--s);border-radius:12px;padding:2px 12px;font-weight:700;color:var(--p)}
@keyframes bob{50%{transform:translateY(-3px)}}@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.chr{display:block;width:100%;height:100%;border-radius:50%;animation:bob 3s ease-in-out infinite}.ey{animation:blink 4.5s infinite;transform-box:fill-box;transform-origin:center}.av{overflow:hidden}
.up{display:inline-block;padding:12px 24px;border-radius:18px;background:linear-gradient(135deg,#7ed0ff,#c9a8ff);color:#fff;cursor:pointer;font-weight:700;box-shadow:0 6px 16px #7ed0ff66;transition:.2s}.up:hover{transform:translateY(-2px) scale(1.04)}
.tg.list{grid-template-columns:1fr}.tg.list .tl{flex-direction:row;justify-content:flex-start;gap:16px;padding:14px 22px}
.ov{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;text-align:center;animation:pop .4s ease both}
body[data-wr=r]{background-color:color-mix(in srgb,var(--bg),#d6403b 28%)}body[data-wr=y]{background-color:color-mix(in srgb,var(--bg),#e9b824 28%)}body[data-wr=g]{background-color:color-mix(in srgb,var(--bg),#2fb36b 28%)}
.cardg{display:inline-block;width:20px;height:28px;border-radius:4px;transform:rotate(-8deg);box-shadow:0 2px 5px #0003;vertical-align:middle;margin:0 3px;background:linear-gradient(150deg,#6fe3a1,#1f9d57)}
.cf{position:absolute;inset:0;overflow:hidden;pointer-events:none}.cf i{position:absolute;top:-30px;font-style:normal;font-size:28px;animation:fall 3s linear infinite}@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
